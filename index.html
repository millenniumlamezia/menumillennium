<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Millennium</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .subtitle {
      margin-top: 0;
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 950px) {
      .grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .panel {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      background: #fafafa;
    }

    .actions {
      margin: 18px 0 16px 0;
    }

    button {
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #115e59;
    }

    .secondary-btn {
      background: #374151;
    }

    .secondary-btn:hover {
      background: #1f2937;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    #status,
    #authStatus,
    #adminStatus {
      margin: 16px 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
    }

    #status {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    #authStatus {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    #adminStatus {
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    #categories {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    .category-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      background: #ffffff;
    }

    .category-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .category-meta {
      color: #666;
      font-size: 14px;
    }

    .empty {
      padding: 16px;
      border: 1px dashed #ccc;
      border-radius: 12px;
      background: #fafafa;
      color: #555;
    }

    .success {
      color: #166534;
    }

    .error {
      color: #991b1b;
    }

    .hidden {
      display: none;
    }

    .admin-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #ecfeff;
      border: 1px solid #a5f3fc;
    }

    .small {
      font-size: 14px;
      color: #666;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 18px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Menu Millennium</h1>
    <p class="subtitle">Menu pubblico + pannello staff</p>

    <div class="grid">
      <section class="panel">
        <h2>Menu pubblico</h2>
        <p class="small">Questa parte è visibile a tutti i clienti che aprono il QR code.</p>

        <div class="actions">
          <button id="loadCategoriesBtn">Carica categorie</button>
        </div>

        <div id="status">Stato: pronto</div>
        <div id="categories"></div>
      </section>

      <section class="panel">
        <h2>Area staff</h2>
        <p class="small">Se sei autenticato, puoi aggiungere categorie dal sito.</p>

        <div id="authStatus">Stato login: verifica sessione...</div>

        <div id="adminBox" class="admin-box hidden">
          <h3>Nuova categoria</h3>

          <label for="categoryName">Nome categoria</label>
          <input type="text" id="categoryName" placeholder="Es. Primi piatti" />

          <label for="categorySlug">Slug</label>
          <input type="text" id="categorySlug" placeholder="Es. primi-piatti" />

          <label for="categoryOrder">Ordine</label>
          <input type="number" id="categoryOrder" placeholder="Es. 6" />

          <label for="categoryVisible">Visibile</label>
          <select id="categoryVisible">
            <option value="true">Sì</option>
            <option value="false">No</option>
          </select>

          <div class="button-row">
            <button id="saveCategoryBtn">Salva categoria</button>
            <button id="logoutBtn" class="secondary-btn">Esci</button>
          </div>

          <div id="adminStatus">Stato admin: pronto</div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://kkdqegeqljxllrjhkfpb.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_fwhO7nTMTiUJd991F1e6tw_xR99S7Ln'

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    const statusEl = document.getElementById('status')
    const categoriesEl = document.getElementById('categories')
    const loadBtn = document.getElementById('loadCategoriesBtn')

    const authStatusEl = document.getElementById('authStatus')
    const adminBoxEl = document.getElementById('adminBox')
    const adminStatusEl = document.getElementById('adminStatus')
    const logoutBtn = document.getElementById('logoutBtn')

    const categoryNameEl = document.getElementById('categoryName')
    const categorySlugEl = document.getElementById('categorySlug')
    const categoryOrderEl = document.getElementById('categoryOrder')
    const categoryVisibleEl = document.getElementById('categoryVisible')
    const saveCategoryBtn = document.getElementById('saveCategoryBtn')

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9\-]/g, '')
        .replace(/\-+/g, '-')
    }

    categoryNameEl.addEventListener('input', () => {
      if (!categorySlugEl.value.trim()) {
        categorySlugEl.value = slugify(categoryNameEl.value)
      }
    })

    async function loadCategories() {
      statusEl.className = ''
      statusEl.textContent = 'Stato: caricamento categorie...'
      categoriesEl.innerHTML = ''

      const { data, error } = await supabase
        .from('categories')
        .select('id, name, slug, visible, sort_order')
        .order('sort_order', { ascending: true })

      if (error) {
        statusEl.className = 'error'
        statusEl.textContent = 'Errore: ' + error.message
        return
      }

      statusEl.className = 'success'
      statusEl.textContent = 'Categorie caricate: ' + data.length

      if (!data || data.length === 0) {
        categoriesEl.innerHTML = '<div class="empty">Nessuna categoria presente nel database.</div>'
        return
      }

      categoriesEl.innerHTML = data.map(category => `
        <div class="category-card">
          <div class="category-name">${category.name}</div>
          <div class="category-meta">Slug: ${category.slug}</div>
          <div class="category-meta">Visibile: ${category.visible ? 'Sì' : 'No'}</div>
          <div class="category-meta">Ordine: ${category.sort_order}</div>
        </div>
      `).join('')
    }

    async function updateAuthState() {
      const { data } = await supabase.auth.getSession()
      const session = data.session

      if (session && session.user) {
        authStatusEl.className = 'success'
        authStatusEl.textContent = 'Stato login: autenticato come ' + session.user.email
        adminBoxEl.classList.remove('hidden')
      } else {
        authStatusEl.className = ''
        authStatusEl.textContent = 'Stato login: non autenticato'
        adminBoxEl.classList.add('hidden')
      }
    }

    async function saveCategory() {
      const name = categoryNameEl.value.trim()
      const slug = categorySlugEl.value.trim() || slugify(name)
      const sort_order = Number(categoryOrderEl.value || 0)
      const visible = categoryVisibleEl.value === 'true'

      if (!name) {
        adminStatusEl.className = 'error'
        adminStatusEl.textContent = 'Inserisci il nome della categoria.'
        return
      }

      if (!slug) {
        adminStatusEl.className = 'error'
        adminStatusEl.textContent = 'Inserisci uno slug valido.'
        return
      }

      adminStatusEl.className = ''
      adminStatusEl.textContent = 'Salvataggio categoria in corso...'

      const { error } = await supabase
        .from('categories')
        .insert({
          name,
          slug,
          sort_order,
          visible
        })

      if (error) {
        adminStatusEl.className = 'error'
        adminStatusEl.textContent = 'Errore salvataggio: ' + error.message
        return
      }

      adminStatusEl.className = 'success'
      adminStatusEl.textContent = 'Categoria salvata con successo.'

      categoryNameEl.value = ''
      categorySlugEl.value = ''
      categoryOrderEl.value = ''
      categoryVisibleEl.value = 'true'

      await loadCategories()
    }

    async function logout() {
      const { error } = await supabase.auth.signOut()

      if (error) {
        authStatusEl.className = 'error'
        authStatusEl.textContent = 'Errore logout: ' + error.message
        return
      }

      await updateAuthState()
      adminStatusEl.className = ''
      adminStatusEl.textContent = 'Stato admin: pronto'
    }

    loadBtn.addEventListener('click', loadCategories)
    saveCategoryBtn.addEventListener('click', saveCategory)
    logoutBtn.addEventListener('click', logout)

    updateAuthState()
    loadCategories()
  </script>
</body>
</html>
